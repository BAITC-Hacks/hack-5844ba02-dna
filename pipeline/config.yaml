seed: 42

data:
  min_tx_kzt: 5000
  max_depth: 4

features:
  seed_upstream_cutoff: 2

roles:
  score_floor: 0.5
  score_ceiling: 1.0
  score_top_percentile: 99.5
  peripheral_isolated_score: 1.0
  coordinator:
    min_pays_seeds: 2
    s1_min_in_deg: 3
    s2_min_in_deg: 5
    s2_min_out_deg: 20
    s3_min_hub_payers: 2
    max_expected: 40
  distributor:
    min_out_deg: 20
    min_out_in_ratio: 0.5
  consolidator:
    min_in_deg: 5
    max_out_in_ratio: 0.5
    min_seed_upstream: 3
    alt_min_in_deg: 3
  transit:
    min_in_deg: 1
    min_out_deg: 1
    max_in_deg: 3
    max_out_deg: 3
    min_pass: 0.8
    max_pass: 1.2
  frontier:
    # Cutoff for classifying fourth-generation truncation as a likely terminal.
    terminal_threshold: 0.5
    train_depths: [1, 2, 3]
    cv_folds: 5
    max_iter: 1000
  terminal:
    min_in_deg: 1

scoring:
  must_have_weights:
    n_seed_upstream: 0.35
    role: 0.30
    betweenness: 0.20
    degree: 0.15
  role_weights:
    coordinator: 1.0
    consolidator: 0.9
    distributor: 0.8
    transit: 0.5
    terminal: 0.3
    frontier: 0.2
    peripheral: 0.0
  seed_multiplier: 0.7
  top_n: 50

clusters:
  resolution: 1.0
  isolated_cluster_id: 0
  top_gids: 5
  min_seeds_for_collection: 2
  small_fragment_max_nodes: 20
  min_transit_share: 0.2       # ≥20% transit: сообщество описывается как транзитная цепочка

export:
  evidence_max_chars: 200

layout:
  scale: 4000
  iterations: 50

resilience:
  # Removal levels cover the presentation point (20) and the full curve.
  n_removed: [0, 5, 10, 20, 50]
  random_runs: 20
