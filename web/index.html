<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Money Graph</title><link rel="stylesheet" href="/web/style.css">
</head>
<body>
  <header class="topbar">
    <div><span class="eyebrow">AML ANALYTICS</span><h1>Money Graph</h1></div>
    <div class="search-wrap"><input id="search" placeholder="Search by full GID or last digits" autocomplete="off"><div id="suggestions" class="suggestions"></div></div>
    <button id="reset" class="ghost">Reset selection</button>
  </header>
  <div class="notice">Conclusions are hypotheses for review, not assertions of guilt.</div>
  <main>
    <section class="canvas-panel"><div class="tabs"><button class="tab active" data-tab="graph">Graph</button><button class="tab" data-tab="top">Top</button><button class="tab" data-tab="clusters">Clusters</button></div>
      <div id="graph-view" class="view active"><div id="cy"></div><div id="legend"></div><div id="loading">Loading graph…</div></div>
      <div id="top-view" class="view"><div class="table-wrap"><table id="top-table"><thead><tr><th>Rank</th><th>GID</th><th>Role</th><th>Priority</th><th>Why</th></tr></thead><tbody></tbody></table></div></div>
      <div id="clusters-view" class="view"><div class="table-wrap"><table id="clusters-table"><thead><tr><th>Cluster</th><th>Nodes</th><th>Seeds</th><th>Internal KZT</th><th>Hypothesis</th><th></th></tr></thead><tbody></tbody></table></div></div>
    </section>
    <aside id="side" class="side"><div class="empty">Select a node to inspect its flows.</div></aside>
  </main>
  <script src="/web/vendor/cytoscape.min.js"></script><script src="/web/app.js"></script>
</body>
</html>
