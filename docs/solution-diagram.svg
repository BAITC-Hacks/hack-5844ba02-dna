<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">Money Graph solution architecture</title>
  <desc id="desc">Parquet data flows through graph metrics, explainable roles and ranking, pipeline artifacts, FastAPI, and the analyst interface.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1118"/>
      <stop offset="1" stop-color="#182431"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#63d4c5"/>
    </marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#f2f6fa}.subtitle{font:16px Arial,sans-serif;fill:#9eb0c0}
      .box{fill:#111b25;stroke:#34495d;stroke-width:2;rx:16}.accent{stroke:#63d4c5}.head{font:700 20px Arial,sans-serif;fill:#f2f6fa}.body{font:14px Arial,sans-serif;fill:#aebdca}.arrow{stroke:#63d4c5;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .tag{font:12px Arial,sans-serif;fill:#63d4c5}.foot{font:14px Arial,sans-serif;fill:#d7e0e8}
    </style>
  </defs>
  <rect width="1400" height="520" fill="url(#bg)"/>
  <text x="70" y="65" class="title">Граф денег: от транзакций к проверяемой гипотезе</text>
  <text x="70" y="96" class="subtitle">Локальный расчёт · объяснимые правила · gid как строка в browser/API · AI необязателен</text>

  <rect x="70" y="155" width="220" height="210" class="box accent"/>
  <text x="95" y="195" class="head">1. Данные</text>
  <text x="95" y="230" class="body">nodes.parquet</text><text x="95" y="257" class="body">edges.parquet</text><text x="95" y="284" class="body">transactions.parquet</text>
  <text x="95" y="326" class="tag">2 248 узлов · 3 119 рёбер</text>

  <path d="M 300 260 L 355 260" class="arrow"/>
  <rect x="370" y="135" width="250" height="250" class="box"/>
  <text x="395" y="175" class="head">2. Метрики графа</text>
  <text x="395" y="210" class="body">Степени и суммы потоков</text><text x="395" y="237" class="body">Seed-flow и betweenness</text><text x="395" y="264" class="body">Временные признаки и циклы</text><text x="395" y="291" class="body">Louvain-кластеры</text><text x="395" y="318" class="body">Frontier и устойчивость</text>
  <text x="395" y="355" class="tag">Детерминированно · &lt; 5 минут</text>

  <path d="M 630 260 L 685 260" class="arrow"/>
  <rect x="700" y="135" width="250" height="250" class="box"/>
  <text x="725" y="175" class="head">3. Роли и приоритет</text>
  <text x="725" y="210" class="body">7 объяснимых ролей</text><text x="725" y="237" class="body">Evidence для каждого узла</text><text x="725" y="264" class="body">Priority score и breakdown</text><text x="725" y="291" class="body">Top-50 для проверки</text><text x="725" y="318" class="body">Гипотезы по кластерам</text>
  <text x="725" y="355" class="tag">Пороги в config.yaml</text>

  <path d="M 960 260 L 1015 260" class="arrow"/>
  <rect x="1030" y="135" width="300" height="250" class="box accent"/>
  <text x="1055" y="175" class="head">4. FastAPI + интерфейс</text>
  <text x="1055" y="210" class="body">Поиск gid и направленные связи</text><text x="1055" y="237" class="body">Карточка и следующие шаги</text><text x="1055" y="264" class="body">Top, кластеры, пути, ego-сеть</text><text x="1055" y="291" class="body">CSV для перечня проверки</text><text x="1055" y="318" class="body">AI-чат OpenAI / NVIDIA</text>
  <text x="1055" y="355" class="tag">Работает локально без LLM-ключа</text>

  <rect x="370" y="420" width="580" height="55" class="box"/>
  <text x="400" y="454" class="foot">Артефакты: nodes_roles.csv · clusters.csv · top_nodes.csv · graph.json</text>
  <path d="M 660 385 L 660 415" class="arrow"/>
</svg>
