# Все пороги и веса пайплайна. Каждое значение сопровождено обоснованием.
# Перцентили посчитаны по предоставленному датасету (2 248 узлов, июль 2026).

seed: 42

data:
  min_tx_kzt: 5000              # порог выгрузки; ниже — невидимо (для near_threshold)

features:
  seed_upstream_cutoff: 2       # без ограничения медиана = 7 seed на узел, сигнал вырождается;
                                # при cutoff=2 от ≥3 seed получают 32 узла — информативно
  betweenness_top_share: 0.02   # «топ-2%» для сигнала моста

temporal:
  fast_pass_max_days: 2         # «пришло и ушло за 1–2 дня» — формулировка ТЗ
  fast_pass_amount_min: 0.5     # исходящая ≥ 50% входящей
  fast_pass_amount_max: 1.2     # и ≤ 120%
  near_threshold_max_kzt: 6000  # [5000, 6000) — 335 транзакций у самого порога
  round_multiple_kzt: 10000
  sync_min_payers: 3            # ≥3 разных плательщика в один день
  cycle_length_bound: 5
  cycle2_min_kzt: 50000         # взаимные пары A⇄B частые (177), учитываем только крупные

frontier:
  train_depths: [1, 2, 3]       # у этих колен исходящие наблюдаемы → есть метка
  cv_folds: 5
  terminal_threshold: 0.65      # P ≥ 0.65 → terminal (оценка); базовая доля стоков в 1–3 коленах ≈ 0.63

roles:
  score_top_percentile: 99.5    # role_score = 1.0 на этом перцентиле признака
  coordinator:
    min_pays_seeds: 2           # S1: платит ≥2 seed — кандидат на выплаты курьерам
    s1_min_in_deg: 3            #     и сам собирает минимум от 3 плательщиков
    s2_min_in_deg: 5            # S2: собирает (верхний ~1%)…
    s2_min_out_deg: 20          #     …и раздаёт (верхний ~1%)
    s3_min_hub_payers: 2        # S3: получает от ≥2 consolidator/distributor
    max_expected: 40            # предупреждение, если больше
  distributor:
    min_out_deg: 20             # p99 out_deg ≈ 24; 20 — чуть мягче, верхний ~1.5%
    min_out_in_ratio: 0.5       # отдаёт не меньше половины полученного (или seed)
  consolidator:
    min_in_deg: 5               # p99 in_deg = 6 → верхний ~1–2%
    max_out_in_ratio: 0.5       # удерживает ≥50% полученного
    min_seed_upstream: 3        # альтернативный путь: деньги от ≥3 seed за ≤2 колена…
    alt_min_in_deg: 3           # …и минимум 3 плательщика
  transit:
    min_pass: 0.8
    max_pass: 1.2               # 70 не-seed узлов в коридоре
    max_in_deg: 3
    max_out_deg: 3
    fast_pass_bonus: 0.2        # +0.2 к role_score при fast_pass_share ≥ 0.5
    fast_pass_min_share: 0.5

scoring:
  weights:                      # сумма = 1.0
    seed_flow_kzt: 0.25
    n_seed_upstream: 0.20
    role: 0.20
    betweenness: 0.15
    degree: 0.10
    temporal: 0.10
  role_weights:
    coordinator: 1.0
    consolidator: 0.9
    distributor: 0.8
    transit: 0.5
    terminal: 0.3
    frontier: 0.2
    peripheral: 0.0
  seed_multiplier: 0.7          # seed уже известны правоохранителям; фокус — на скрытых узлах
  top_n: 50

flow:
  max_iter: 50
  tol: 1.0e-6

clusters:
  resolution: 1.0
  stability_runs: 10            # прогоны с seed 0..9 → средний ARI
  isolated_cluster_id: 0
  top_gids: 5

resilience:
  n_removed: [0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50]
  random_runs: 5

layout:
  scale: 4000
  iterations: 50
