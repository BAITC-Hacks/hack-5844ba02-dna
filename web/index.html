<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light"><title>Trace / аналитическая консоль</title>
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">{"imports":{"cytoscape":"./vendor/cytoscape.esm.mjs","chart.js":"./vendor/chart-adapter.js"}}</script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#graph" aria-label="Trace — главная"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 12 5-6 6 3 5-5M4 12l6 7 5-4 5 3"/></svg><span>TRACE</span></a>
    <div class="search-wrap"><label class="sr-only" for="search">Поиск gid</label><input id="search" autocomplete="off" placeholder="Найти gid или последние цифры…" aria-expanded="false" aria-controls="suggestions"><kbd>/</kbd><div id="suggestions" class="suggestions" role="listbox"></div></div>
    <div id="summary-chips" class="summary-chips" aria-label="Сводка"></div>
    <div class="top-actions"><button id="toggle-filters" class="icon-btn" title="Показать или скрыть рабочую панель" aria-pressed="false">☰</button><button id="review-btn" class="icon-btn" title="Перечень на проверку">◎ <b id="review-count">0</b></button><button id="run" class="button primary">Пересчитать</button><button id="theme" class="icon-btn" title="Тема">◐</button><button id="help" class="icon-btn" title="Горячие клавиши">?</button></div>
  </header>
  <main class="shell">
    <nav class="tabs" role="tablist" aria-label="Разделы"><button role="tab" data-tab="graph">01 Граф</button><button role="tab" data-tab="top">02 Топ</button><button role="tab" data-tab="clusters">03 Кластеры</button><button role="tab" data-tab="resilience">04 Устойчивость</button><button role="tab" data-tab="assistant">05 Ассистент</button></nav>
    <section class="workspace">
      <div id="view" class="view"></div>
      <aside id="card" class="card-panel" aria-label="Карточка узла"><button id="close-card" class="close">×</button><div class="empty">Выберите узел на графе<br><small>или найдите его по gid</small></div></aside>
    </section>
  </main>
  <dialog id="palette"><form method="dialog" class="palette"><input id="palette-input" placeholder="Команда или gid…" autofocus><div id="palette-results"></div><footer><kbd>↑↓</kbd> навигация <kbd>↵</kbd> выбрать <kbd>esc</kbd> закрыть</footer></form></dialog>
  <dialog id="review"><div class="dialog-head"><h2>Перечень на проверку</h2><button onclick="this.closest('dialog').close()">×</button></div><div id="review-list"></div><button id="export-review" class="button">Экспорт CSV</button></dialog>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="./stage2-layout.js"></script><script type="module" src="./app.js"></script>
</body></html>
